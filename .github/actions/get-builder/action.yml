name: "Pobierz legendaryos-builder"
description: >
  Instaluje legendaryos-builder w /usr/local/bin: albo pobiera gotową binarkę z wydania
  (release), albo buduje ją ze źródeł (source) -- wtedy potrzebuje bit i kompilatora H#,
  który można pobrać jako gotową binarkę (hsharp_source=release) albo zbudować ze źródeł
  (hsharp_source=source: klonuje HackerOS-Linux-System/H-Sharp i buduje cargo + LLVM 21).

inputs:
  source:
    description: "release = gotowa binarka z GitHub Releases, source = budowa ze źródeł"
    required: false
    default: "release"
  version:
    description: "Tag wydania (release) albo gałąź/tag do sklonowania (source). `latest` = najnowsza wersja."
    required: false
    default: "latest"

  hsharp_source:
    description: "Tylko gdy source=source: release = gotowa binarka H#, source = budowa H# ze źródeł (klon H-Sharp)"
    required: false
    default: "release"
  hsharp_version:
    description: "Wersja H# (tag wydania / gałąź do sklonowania). `latest` = najnowsza."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Zbuduj H# ze źródeł (klon H-Sharp)
      if: ${{ inputs.source == 'source' && inputs.hsharp_source == 'source' }}
      uses: ./.github/actions/build-hsharp
      with:
        version: ${{ inputs.hsharp_version }}

    - name: Zainstaluj legendaryos-builder
      shell: bash
      env:
        BUILDER_SOURCE: ${{ inputs.source }}
        BUILDER_VERSION: ${{ inputs.version }}
        HSHARP_SOURCE: ${{ inputs.hsharp_source }}
        HSHARP_VERSION: ${{ inputs.hsharp_version }}
      run: |
        set -euo pipefail

        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi

        # narzędzia pomocnicze (w kontenerze debian:testing ich nie ma)
        if ! command -v curl >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1; then
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends curl git ca-certificates
        fi

        ORG="LegendaryOS-Linux-System"
        BUILDER_REPO="https://github.com/${ORG}/LegendaryOS-Builder"

        # URL do assetu wydania: najnowsza wersja albo konkretny tag
        asset_url() {  # $1=repo-url $2=wersja $3=nazwa assetu
          if [ "$2" = "latest" ] || [ -z "$2" ]; then
            echo "$1/releases/latest/download/$3"
          else
            echo "$1/releases/download/$2/$3"
          fi
        }

        if [ "$BUILDER_SOURCE" = "release" ]; then
          echo "::group::Pobieranie gotowej binarki legendaryos-builder (${BUILDER_VERSION})"
          URL="$(asset_url "$BUILDER_REPO" "$BUILDER_VERSION" legendaryos-builder)"
          echo "$URL"
          curl -fsSL --retry 3 -o /tmp/legendaryos-builder "$URL"
          $SUDO install -m 0755 /tmp/legendaryos-builder /usr/local/bin/legendaryos-builder
          echo "::endgroup::"
        elif [ "$BUILDER_SOURCE" = "source" ]; then
          echo "::group::Pobieranie bit i H# (${HSHARP_SOURCE})"
          # menedżer pakietów
          curl -fsSL --retry 3 -o /tmp/bit \
            "$(asset_url "https://github.com/HackerOS-Linux-System/bit" latest bit)"
          $SUDO install -m 0755 /tmp/bit /usr/local/bin/bit
          if [ "$HSHARP_SOURCE" = "source" ]; then
            # H# został już zbudowany ze źródeł przez ./.github/actions/build-hsharp
            command -v "h#" >/dev/null || { echo "::error::brak h# po budowie ze źródeł"; exit 1; }
            echo "H#: zbudowany ze źródeł -> $(command -v 'h#')"
          else
            # kompilator H# (binarka `hsharp`; `h#` to ta sama binarka pod drugą nazwą)
            curl -fsSL --retry 3 -o /tmp/hsharp \
              "$(asset_url "https://github.com/HackerOS-Linux-System/H-Sharp" "${HSHARP_VERSION:-latest}" hsharp)"
            $SUDO install -m 0755 /tmp/hsharp /usr/local/bin/hsharp
            $SUDO ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          fi
          echo "::endgroup::"

          echo "::group::Klonowanie LegendaryOS-Builder"
          SRC="${RUNNER_TEMP:-/tmp}/legendaryos-builder-src"
          rm -rf "$SRC"
          if [ "$BUILDER_VERSION" = "latest" ] || [ -z "$BUILDER_VERSION" ]; then
            git clone --depth 1 "${BUILDER_REPO}.git" "$SRC"
          else
            git clone --depth 1 --branch "$BUILDER_VERSION" "${BUILDER_REPO}.git" "$SRC"
          fi
          echo "::endgroup::"

          echo "::group::Budowa legendaryos-builder ze źródeł"
          cd "$SRC"
          bit install
          "h#" check src/main.h#
          bit build --release
          ./cache/build/release/legendaryos-builder selftest
          $SUDO install -m 0755 cache/build/release/legendaryos-builder /usr/local/bin/legendaryos-builder
          echo "::endgroup::"
        else
          echo "::error::Nieznane źródło buildera: '$BUILDER_SOURCE' (release | source)"
          exit 1
        fi

        legendaryos-builder --version
