name: "Zbuduj H# ze źródeł"
description: >
  Klonuje https://github.com/HackerOS-Linux-System/H-Sharp.git i buduje kompilator H# za pomocą `bit`.
  H# jest samodzielnym kompilatorem napisanym w H# (generuje C++), więc nie potrzeba cargo ani LLVM --
  potrzebny jest tylko g++ oraz działający kompilator stage0 (gotowa binarka z wydania), który buduje
  źródła (stage1), a te budują się jeszcze raz (stage2, test samodzielności).
  Wynik: /usr/local/bin/hsharp, dowiązanie /usr/local/bin/h#, `bit` w /usr/local/bin
  oraz biblioteka standardowa w /usr/lib/HackerOS/H#/std.

inputs:
  version:
    description: "Gałąź/tag H-Sharp do sklonowania. `latest` = domyślna gałąź (najnowszy stan)."
    required: false
    default: "latest"
  stage0_url:
    description: "URL binarki stage0 `hsharp`. Puste = najnowsze wydanie H-Sharp."
    required: false
    default: ""
  stages:
    description: "1 = stage1 (stage0 buduje źródła), 2 = dodatkowo stage2 (stage1 buduje źródła ponownie)."
    required: false
    default: "2"

runs:
  using: "composite"
  steps:
    - name: Zależności budowy (g++, narzędzia)
      shell: bash
      run: |
        set -euo pipefail
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
        export DEBIAN_FRONTEND=noninteractive
        $SUDO apt-get update
        $SUDO apt-get install -y --no-install-recommends \
          git curl ca-certificates build-essential g++ make findutils
        g++ --version | head -n 1

    - name: Klonowanie H-Sharp
      shell: bash
      env:
        HSHARP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        SRC="${RUNNER_TEMP:-/tmp}/h-sharp-src"
        rm -rf "$SRC"
        if [ "$HSHARP_VERSION" = "latest" ] || [ -z "$HSHARP_VERSION" ]; then
          git clone --depth 1 https://github.com/HackerOS-Linux-System/H-Sharp.git "$SRC"
        else
          git clone --depth 1 --branch "$HSHARP_VERSION" https://github.com/HackerOS-Linux-System/H-Sharp.git "$SRC"
        fi
        echo "HSHARP_SRC=$SRC" >> "$GITHUB_ENV"
        git -C "$SRC" log -1 --format='H-Sharp @ %h  %s'

    - name: Stage0 (hsharp z wydania) + bit + std
      shell: bash
      env:
        STAGE0_URL: ${{ inputs.stage0_url }}
      run: |
        set -euo pipefail
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
        : "${STAGE0_URL:=https://github.com/HackerOS-Linux-System/H-Sharp/releases/latest/download/hsharp}"
        BIT_URL="https://github.com/HackerOS-Linux-System/bit/releases/latest/download/bit"

        fetch_elf() {  # $1=url $2=ścieżka
          curl -fsSL --retry 3 -o "$2" "$1"
          if [ "$(head -c 4 "$2" | od -An -c | tr -d ' ')" != '177ELF' ]; then
            echo "::error::$1 nie zwrócił binarki ELF"; exit 1
          fi
        }
        fetch_elf "$STAGE0_URL" /tmp/hsharp-stage0
        fetch_elf "$BIT_URL" /tmp/bit
        $SUDO install -m 0755 /tmp/hsharp-stage0 /usr/local/bin/hsharp
        $SUDO ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
        $SUDO install -m 0755 /tmp/bit /usr/local/bin/bit

        # kompilator szuka modułów w /usr/lib/HackerOS/H#/std/<moduł>.h# (std z tego samego checkoutu co źródła)
        $SUDO rm -rf "/usr/lib/HackerOS/H#/std"
        $SUDO mkdir -p "/usr/lib/HackerOS/H#/std"
        $SUDO cp -a "$HSHARP_SRC/std/." "/usr/lib/HackerOS/H#/std/"
        test -f "/usr/lib/HackerOS/H#/std/fmt.h#" || { echo "::error::brak std/fmt.h# po instalacji"; exit 1; }
        "h#" --version

    - name: Budowa H# ze źródeł (bit build --release, stage1 → stage2)
      shell: bash
      env:
        STAGES: ${{ inputs.stages }}
        HSHARP_COLOR: "0"
      run: |
        set -euo pipefail
        SUDO=""
        if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
        cd "$HSHARP_SRC"

        find_binary() {
          local d="cache/build/release" n
          for n in hsharp "h#" cli; do
            if [ -f "$d/$n" ] && [ -x "$d/$n" ]; then echo "$d/$n"; return 0; fi
          done
          find "$d" -maxdepth 2 -type f -perm -u+x ! -name '*.so' ! -name '*.a' ! -name '*.o' ! -name '*.sh' 2>/dev/null | head -n 1
        }

        build_stage() {  # $1 = numer etapu, $2 = plik wyjściowy
          echo "::group::H# stage$1 (bit install / check / build --release)"
          rm -rf cache
          bit install
          "h#" check source-code/cli/src/main.h#
          bit build --release
          local bin; bin="$(find_binary)"
          [ -n "$bin" ] || { echo "::error::bit build nie wytworzył binarki w cache/build/release"; ls -la cache/build/release || true; exit 1; }
          install -m 0755 "$bin" "$2"
          "$2" --version
          echo "::endgroup::"
        }

        build_stage 1 "$RUNNER_TEMP/hsharp-stage1"
        FINAL="$RUNNER_TEMP/hsharp-stage1"
        if [ "${STAGES:-2}" -ge 2 ]; then
          # stage1 zastępuje stage0 i buduje te same źródła ponownie
          $SUDO install -m 0755 "$FINAL" /usr/local/bin/hsharp
          $SUDO ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          hash -r
          build_stage 2 "$RUNNER_TEMP/hsharp-stage2"
          FINAL="$RUNNER_TEMP/hsharp-stage2"
        fi

        $SUDO install -m 0755 "$FINAL" /usr/local/bin/hsharp
        $SUDO ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
        hash -r
        command -v "h#"
        "h#" --version

    - name: Test dymny (h# run + h# compile)
      shell: bash
      run: |
        set -euo pipefail
        echo 'fn main() is write("smoke test ok") end' > /tmp/smoke.h#
        "h#" run /tmp/smoke.h#
        "h#" compile /tmp/smoke.h# -o /tmp/smoke
        /tmp/smoke
