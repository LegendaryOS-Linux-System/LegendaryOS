name: Build LegendaryOS Classic

on:
  workflow_call:
    inputs:
      builder-source:
        required: true
        type: string
      builder-version:
        required: false
        type: string
        default: 'v0.5.3'
      build-target:
        description: 'What to build: all | cloud | iso'
        required: false
        type: string
        default: 'all'
      ref:
        description: 'Branch/tag/commit to checkout'
        required: false
        type: string
        default: ''
    secrets:
      LEGENDARYOS_BUILD:
        required: true

  workflow_dispatch:
    inputs:
      builder-source:
        description: 'How to get legendaryos-builder'
        required: true
        type: choice
        options: [release, source]
        default: release
      builder-version:
        description: 'Builder version (release only)'
        required: false
        default: 'v0.5.3'
      build-target:
        description: 'What to build'
        required: true
        type: choice
        options: [all, cloud, iso]
        default: all

jobs:
  build-classic:
    name: Build Classic (mutable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LegendaryOS
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman skopeo python3 qemu-user-static

      - name: Get builder (release binary)
        if: inputs.builder-source == 'release'
        run: |
          curl -fsSL \
            "https://github.com/LegendaryOS-Linux-System/LegendaryOS-Builder/releases/download/${{ inputs.builder-version }}/legendaryos-builder" \
            -o /usr/local/bin/legendaryos-builder
          chmod +x /usr/local/bin/legendaryos-builder
          legendaryos-builder --version

      - name: Get builder (build from source)
        if: inputs.builder-source == 'source'
        run: |
          sudo apt-get install -y --no-install-recommends golang ruby
          git clone --depth=1 \
            https://github.com/LegendaryOS-Linux-System/LegendaryOS-Builder.git \
            /tmp/los-builder
          cd /tmp/los-builder
          ruby build.rb
          sudo cp legendaryos-builder /usr/local/bin/legendaryos-builder
          legendaryos-builder --version

      - name: Build classic cloud image (podman build + push)
        if: inputs.build-target == 'all' || inputs.build-target == 'cloud'
        env:
          GITHUB_TOKEN: ${{ secrets.LEGENDARYOS_BUILD }}
        run: |
          sudo -E legendaryos-builder build cloud -push

      - name: Build classic ISO
        if: inputs.build-target == 'all' || inputs.build-target == 'iso'
        env:
          GITHUB_TOKEN: ${{ secrets.LEGENDARYOS_BUILD }}
        run: |
          sudo -E legendaryos-builder build iso --verbose 2>&1 | tee /tmp/build-classic-iso.log

      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p /tmp/los-logs
          cp /tmp/build-classic-iso.log      /tmp/los-logs/ 2>/dev/null || true
          cp build/anaconda.ks               /tmp/los-logs/ 2>/dev/null || true
          cp build/Containerfile             /tmp/los-logs/ 2>/dev/null || true
          cp build/output/bib-config.toml   /tmp/los-logs/ 2>/dev/null || true
          sudo podman images                 > /tmp/los-logs/podman-images.txt 2>/dev/null || true
          sudo podman image inspect \
            ghcr.io/legendaryos-linux-system/legendaryos:stable-classic \
            > /tmp/los-logs/image-inspect.json 2>/dev/null || true
          df -h                              > /tmp/los-logs/df.txt 2>/dev/null || true
          cd /tmp && zip -r los-classic-logs.zip los-logs/

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: los-classic-logs
          path: /tmp/los-classic-logs.zip
          retention-days: 14

      - name: Upload ISO
        if: success() && (inputs.build-target == 'all' || inputs.build-target == 'iso')
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryOS-classic-iso
          path: build/output/*.iso
          retention-days: 30
