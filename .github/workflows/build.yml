name: Build LegendaryOS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to build'
        required: true
        type: choice
        options:
          - stable
          - classic
          - both
        default: stable

      builder-source:
        description: 'How to get legendaryos-builder'
        required: true
        type: choice
        options:
          - release
          - source
        default: release

      builder-version:
        description: 'Builder release version (ignored when builder-source=source)'
        required: false
        default: 'v0.5.3'

permissions:
  contents: read
  packages: write

jobs:
  # ── Stable ──────────────────────────────────────────────────────────────
  stable:
    name: Stable Edition
    if: ${{ github.event_name == 'push' || inputs.edition == 'stable' || inputs.edition == 'both' }}
    uses: ./.github/workflows/stable.yml
    with:
      builder-source: ${{ inputs.builder-source || 'release' }}
      builder-version: ${{ inputs.builder-version || 'v0.5.3' }}
    secrets:
      LEGENDARYOS_BUILD: ${{ secrets.LEGENDARYOS_BUILD }}

  # ── Classic ──────────────────────────────────────────────────────────────
  classic:
    name: Classic Edition
    if: ${{ inputs.edition == 'classic' || inputs.edition == 'both' }}
    uses: ./.github/workflows/classic.yml
    with:
      builder-source: ${{ inputs.builder-source || 'release' }}
      builder-version: ${{ inputs.builder-version || 'v0.5.3' }}
    secrets:
      LEGENDARYOS_BUILD: ${{ secrets.LEGENDARYOS_BUILD }}

  # ── Summary ──────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [stable, classic]
    steps:
      - name: Print summary
        run: |
          echo "## LegendaryOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Edition | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          stable_result="${{ needs.stable.result }}"
          classic_result="${{ needs.classic.result }}"

          case "$stable_result" in
            success) echo "| Stable  | ✅ Success |" >> "$GITHUB_STEP_SUMMARY" ;;
            failure) echo "| Stable  | ❌ Failed — download **los-stable-logs** artifact |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| Stable  | ⏭ Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| Stable  | ⚠ $stable_result |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

          case "$classic_result" in
            success) echo "| Classic | ✅ Success |" >> "$GITHUB_STEP_SUMMARY" ;;
            failure) echo "| Classic | ❌ Failed — download **los-classic-logs** artifact |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| Classic | ⏭ Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| Classic | ⚠ $classic_result |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

          if [ "$stable_result" = "failure" ] || [ "$classic_result" = "failure" ]; then
            echo ""
            echo "::error::One or more builds failed. Download the logs artifact and send it for diagnostics."
            exit 1
          fi
