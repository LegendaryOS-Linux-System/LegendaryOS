[project]
name         = "LegendaryOS"
version      = "0.0.1"
description  = "Fedora-based OS for developers and gamers"
author       = "LegendaryOS-Linux-System"
license      = "GPL-3.0"
base_distro  = "fedora"
base_version = 44
arch         = "x86_64"

[system]
hostname         = "legendaryos"
locale           = "pl_PL.UTF-8"
language         = "pl_PL:pl:en_US:en"
timezone         = "Europe/Warsaw"
keyboard         = "pl"
selinux          = "enforcing"
firewall         = true
services_enable  = ["sshd", "NetworkManager", "bluetooth", "cups", "fstrim.timer"]
services_disable = ["ModemManager"]

[desktop]
environment     = "kde"
display_server  = "wayland"
auto_login      = false
auto_login_user = ""

[boot]
bootloader  = "grub2"
# mitigations=off → +5-15% FPS w grach (usuń jeśli zależy Ci na security)
# nvidia-drm.modeset=1 i fbdev=1 są dodawane automatycznie gdy [nvidia] enabled=true
kernel_args = "quiet splash mitigations=off"
splash      = true
timeout     = 5

# ── NVIDIA proprietary drivers ────────────────────────────────────────────────
# Sterowniki są instalowane przez Anaconda kickstart w sekcji %post.
# NIE są częścią kontenera bootc — instalują się podczas instalacji systemu.
#
# Obsługiwane karty: WSZYSTKIE karty NVIDIA od Kepler (GTX 600) wzwyż:
#   Maxwell  : GTX 750, GTX 900
#   Pascal   : GTX 1000 (GTX 1060, 1070, 1080...)
#   Turing   : RTX 2000 (RTX 2060, 2070, 2080...)
#   Ampere   : RTX 3000 (RTX 3060, 3070, 3080, 3090...)
#   Ada      : RTX 4000 (RTX 4060, 4070, 4080, 4090...)
#   Blackwell: RTX 5000 (RTX 5070, 5080, 5090...)
[nvidia]
# Czy instalować proprietary sterowniki NVIDIA
enabled = true

# Otwarto-źródłowy moduł kernela (nvidia-open)
# true  → dla kart Turing+ (RTX 2xxx i nowsze) — lepszy, wspierany przez NVIDIA
# false → dla wszystkich kart (Kepler+), bezpieczniejszy domyślny wybór
open_driver = false

# Zablokuj nouveau (open-source driver) — WYMAGANE przy proprietary
blacklist_nouveau = true

# Kernel Mode Setting — WYMAGANE dla Wayland + NVIDIA
# Dodaje nvidia-drm.modeset=1 nvidia-drm.fbdev=1 do kernel_args
enable_kms = true

# nvidia-settings — graficzne narzędzie konfiguracji NVIDIA
install_nvidia_settings = true

# nvidia-vaapi-driver — hardware video decode (Firefox, MPV, Chromium)
install_vaapi = true

# Vulkan ICD dla NVIDIA
install_vulkan = true

# CUDA toolkit — potrzebne do ML/AI/compute (duży pakiet, ~500MB)
# Ustaw true jeśli planujesz używać PyTorch, TensorFlow, CUDA aplikacji
install_cuda = false

# ── Anaconda Installer ────────────────────────────────────────────────────────
[anaconda]
enabled            = true
kickstart_embed    = true
product_name       = "LegendaryOS"
product_version    = "1.0.0"
webui              = true
hide_shell         = false
default_lang       = "pl_PL.UTF-8"
default_keyboard   = "pl"
default_timezone   = "Europe/Warsaw"
root_password_lock = true
default_user       = "user"
default_user_groups = ["wheel", "audio", "video", "gamemode", "input", "render"]

[build]
output_dir   = "build/output"
cache_dir    = "build/cache"
compression  = "zstd"
iso_label    = "LEGENDARYOS_1_0"
iso_filename = "LegendaryOS-1.0.0-fedora44.x86_64.iso"
jobs         = 4
clean_build  = false

[container]
enabled    = true
registry   = "custom"
image      = "legendaryos"
tag        = "0.0.1"
push       = false
sign_image = false
bootc_mode = true
