[project]
name         = "LegendaryOS"
version      = "1.0.0"
description  = "Fedora-based OS for developers and gamers"
author       = "LegendaryOS-Linux-System"
license      = "GPL-2.0"
base_distro  = "fedora"
base_version = 44
arch         = "x86_64"

[system]
hostname         = "legendaryos"
locale           = "pl_PL.UTF-8"
language         = "pl_PL:pl:en_US:en"
timezone         = "Europe/Warsaw"
keyboard         = "pl"
selinux          = "enforcing"
firewall         = true
services_enable  = ["sshd", "NetworkManager", "bluetooth", "cups", "fstrim.timer"]
services_disable = ["ModemManager"]

[desktop]
environment     = "kde"
display_server  = "wayland"
auto_login      = false
auto_login_user = ""

[boot]
bootloader  = "grub2"
kernel_args = "quiet splash mitigations=off"
splash      = true
timeout     = 5

[anaconda]
enabled            = true
kickstart_embed    = true
product_name       = "LegendaryOS"
product_version    = "1.0.0"
webui              = true
hide_shell         = false
default_lang       = "pl_PL.UTF-8"
default_keyboard   = "pl"
default_timezone   = "Europe/Warsaw"
root_password_lock = true
default_user       = "user"
default_user_groups = ["wheel", "audio", "video", "gamemode", "input", "render"]

[build]
output_dir   = "build/output"
cache_dir    = "build/cache"
compression  = "zstd"
iso_label    = "LEGENDARYOS_1_0"
iso_filename = "LegendaryOS-1.0.0-fedora44.x86_64.iso"
jobs         = 4
clean_build  = false

[container]
# "custom" = weź registry z user.toml (ghcr.io/<github.name>)
# Alternatywnie możesz wpisać bezpośrednio: "ghcr.io/LegendaryOS-Linux-System"
enabled    = true
registry   = "custom"
image      = "legendaryos"
tag        = "1.0.0"
push       = false
sign_image = false
bootc_mode = true
