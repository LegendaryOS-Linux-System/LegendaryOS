[project]
name         = "LegendaryOS"
version      = "stable-blue"
description  = "Fedora-based OS"
author       = "LegendaryOS-Linux-System"
license      = "GPL-3.0"
base_distro  = "fedora"
base_version = 44
arch         = "x86_64"

[system]
hostname         = "legendaryos"
locale           = "pl_PL.UTF-8"
language         = "pl_PL:pl:en_US:en"
timezone         = "Europe/Warsaw"
keyboard         = "pl"
selinux          = "enforcing"
firewall         = true
services_enable  = ["sshd", "NetworkManager", "bluetooth", "cups", "fstrim.timer"]
services_disable = ["ModemManager"]

[desktop]
environment     = "blue"
display_server  = "wayland"
auto_login      = false
auto_login_user = ""

[boot]
bootloader  = "grub2"
kernel_args = "quiet splash mitigations=off"
splash      = true
timeout     = 5

[anaconda]
enabled            = true
kickstart_embed    = true
product_name       = "LegendaryOS"
product_version    = "0.1.0"
webui              = true
hide_shell         = false
default_lang       = "pl_PL.UTF-8"
default_keyboard   = "pl"
default_timezone   = "Europe/Warsaw"
root_password_lock = true
default_user       = "user"
default_user_groups = ["wheel", "audio", "video", "gamemode", "input", "render"]

[build]
output_dir   = "build/output"
cache_dir    = "build/cache"
compression  = "zstd"
iso_label    = "LEGENDARYOS_1_0"
iso_filename = "LegendaryOS-blue-fedora44.x86_64.iso"
jobs         = 4
clean_build  = false
filesystem   = "ext4"

[nvidia]
enabled                = true
open_driver            = false
blacklist_nouveau      = true
enable_kms             = true
install_nvidia_settings = true
install_vaapi          = true
install_vulkan         = true
install_cuda           = false

[container]
enabled    = true
registry   = "repo"
repo       = "LegendaryOS-Linux-System/legendaryos"
image      = "legendaryos"
tag        = "stable-blue"
push       = false
sign_image = false
bootc_mode = true
